# Pinot broker: every SQL query needs credentials.
pinot.broker.access.control.class=org.apache.pinot.broker.broker.BasicAuthAccessControlFactory
pinot.broker.access.control.principals=admin,analyst
pinot.broker.access.control.principals.admin.password=adminpass
pinot.broker.access.control.principals.analyst.password=analystpass
pinot.broker.access.control.principals.analyst.tables=patient_events,department_stats
