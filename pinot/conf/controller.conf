# Pinot controller with Basic Auth turned on.
# Demo credentials only. In a real deployment these come from a secret store, never from git.
controller.helix.cluster.name=HealthCluster
controller.port=9000
controller.host=pinot-controller
controller.zk.str=zookeeper:2181
controller.data.dir=/tmp/pinot/data/controller

# Who may call the controller REST API (create tables, upload segments, run queries in the UI).
controller.admin.access.control.factory.class=org.apache.pinot.controller.api.access.BasicAuthAccessControlFactory
controller.admin.access.control.principals=admin,analyst
controller.admin.access.control.principals.admin.password=adminpass
controller.admin.access.control.principals.analyst.password=analystpass
controller.admin.access.control.principals.analyst.permissions=READ

# The controller itself must authenticate when it downloads segments from other components.
controller.segment.fetcher.auth.token=Basic YWRtaW46YWRtaW5wYXNz
