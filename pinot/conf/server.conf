# Pinot server: once the controller requires auth, the server must send a token too,
# or segment uploads and downloads start failing. This is the same class of problem
# that breaks ingestion clients (like the Flink connector) when auth is switched on.
pinot.server.instance.auth.token=Basic YWRtaW46YWRtaW5wYXNz
pinot.server.segment.fetcher.auth.token=Basic YWRtaW46YWRtaW5wYXNz
pinot.server.segment.uploader.auth.token=Basic YWRtaW46YWRtaW5wYXNz
