# Realtime health analytics: Kafka -> Flink -> Kafka -> Pinot (auth on) + Prometheus/Grafana.
# Start everything with:  docker compose up -d --build
name: health-analytics

x-pinot: &pinot
  image: apachepinot/pinot:1.3.0
  restart: unless-stopped
  depends_on:
    zookeeper:
      condition: service_healthy

services:
  zookeeper:
    image: zookeeper:3.9.2
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes: ["./scripts:/scripts:ro"]
    restart: "no"

  pinot-controller:
    <<: *pinot
    command: StartController -configFileName /config/controller.conf
    ports: ["9000:9000"]
    volumes: ["./pinot/conf:/config:ro"]
    environment:
      JAVA_OPTS: >-
        -Xms256M -Xmx1G
        -javaagent:/opt/pinot/etc/jmx_prometheus_javaagent/jmx_prometheus_javaagent.jar=8008:/opt/pinot/etc/jmx_prometheus_javaagent/configs/controller.yml
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health"]
      interval: 5s
      retries: 40

  pinot-broker:
    <<: *pinot
    command: StartBroker -zkAddress zookeeper:2181 -clusterName HealthCluster -configFileName /config/broker.conf
    ports: ["8099:8099"]
    volumes: ["./pinot/conf:/config:ro"]
    depends_on:
      pinot-controller:
        condition: service_healthy
    environment:
      JAVA_OPTS: >-
        -Xms256M -Xmx1G
        -javaagent:/opt/pinot/etc/jmx_prometheus_javaagent/jmx_prometheus_javaagent.jar=8008:/opt/pinot/etc/jmx_prometheus_javaagent/configs/broker.yml
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8099/health"]
      interval: 5s
      retries: 40

  pinot-server:
    <<: *pinot
    command: StartServer -zkAddress zookeeper:2181 -clusterName HealthCluster -configFileName /config/server.conf
    volumes: ["./pinot/conf:/config:ro"]
    depends_on:
      pinot-broker:
        condition: service_healthy
    environment:
      JAVA_OPTS: >-
        -Xms256M -Xmx2G
        -javaagent:/opt/pinot/etc/jmx_prometheus_javaagent/jmx_prometheus_javaagent.jar=8008:/opt/pinot/etc/jmx_prometheus_javaagent/configs/server.yml
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8097/health"]
      interval: 5s
      retries: 40

  pinot-init:
    image: apachepinot/pinot:1.3.0
    depends_on:
      pinot-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/scripts/create-pinot-tables.sh"]
    environment:
      PINOT_USER: admin
      PINOT_PASSWORD: adminpass
    volumes:
      - ./scripts:/scripts:ro
      - ./pinot:/pinot:ro
    restart: "no"

  # One image holds the Flink job and the event generator (same fat jar).
  flink-jobmanager:
    build: ./pipeline
    image: health-pipeline:latest
    command: standalone-job --job-classname dev.prajwal.health.job.HealthAnalyticsJob
    ports: ["8081:8081"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment: &flink-env
      KAFKA_BROKERS: kafka:9092
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 2
        taskmanager.numberOfTaskSlots: 2
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    restart: unless-stopped

  flink-taskmanager:
    image: health-pipeline:latest
    command: taskmanager
    depends_on: [flink-jobmanager]
    environment: *flink-env
    restart: unless-stopped

  event-generator:
    image: health-pipeline:latest
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_started
    entrypoint: ["java", "-cp", "/opt/flink/usrlib/health-pipeline.jar", "dev.prajwal.health.generator.EventGenerator"]
    environment:
      KAFKA_BROKERS: kafka:9092
      EVENTS_PER_SECOND: "20"
      BAD_RECORD_PERCENT: "1"
      LATE_EVENT_PERCENT: "2"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
